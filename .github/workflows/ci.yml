name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, feature/demo-render]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: php-margus-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test demo container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs demo; docker stop demo' EXIT
          docker run -d --name demo -e APP_KEY=test-key -e PORT=8080 -e APP_ENV=production -e APP_DEBUG=false -e DEMO_MODE=true -e LOG_CHANNEL=stderr -p 8080:8080 php-margus-demo:ci
          status=$(curl --fail --retry 30 --retry-delay 2 --retry-connrefused --output /tmp/demo-health --write-out '%{http_code}' http://localhost:8080/up)
          test "$status" = 200
          for path in /et /et/leaflet; do
            status=$(curl --silent --show-error --output /tmp/demo-response --write-out '%{http_code}' "http://localhost:8080$path")
            test "$status" = 200
          done

  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Poppler (pdftotext/pdfinfo for PDF tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, gd, intl, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Find Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application environment
        run: cp .env.example .env && php artisan key:generate

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test
