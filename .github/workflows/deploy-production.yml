name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.PRODUCTION_ENABLED == 'true'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
    secrets: inherit
