services:
  - type: web
    name: php-margus-demo
    runtime: docker
    plan: free
    branch: feature/demo-render # Change to develop/main later.
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: et
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CHAT_ENABLED
        value: "false"
      - key: TRUSTED_PROXIES
        value: "*"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
